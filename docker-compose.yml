name: licensehub

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env (see .env.example)}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-licensehub}
      MARIADB_USER: ${MARIADB_USER:-licensehub}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3307}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/LicenseHub.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__LicenseHub: "Server=mariadb;Port=3306;Database=${MARIADB_DATABASE:-licensehub};User ID=${MARIADB_USER:-licensehub};Password=${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env (see .env.example)}"
      Database__ApplyMigrationsOnStartup: "true"
      # Empty in Development means an ephemeral key; required in any other environment.
      Signing__PrivateKey: ${SIGNING_PRIVATE_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

volumes:
  mariadb-data:
